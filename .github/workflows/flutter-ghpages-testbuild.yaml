name: Test Build — Flutter Web (no deploy) - by Rob aka YuVi

on:
  pull_request:
    branches: [ "sanctuary" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get
        # because it's a mono repo structure... r.c.
        working-directory: ./

      - name: Build Flutter Web (test only — no deploy)
        run: flutter build web --base-href / --target lib/web_main.dart
        # because it's a mono repo structure... r.c.
        working-directory: ./
