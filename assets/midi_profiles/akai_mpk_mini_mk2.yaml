# Akai MPK Mini Mk II: Rob's controller.
#
# Numbers were read from the controller itself on 2026-11-03, with a SysEx
# program dump (see _DEVELOPER_NOTES/_NON_HUMAN_NOTES/debugging_midi_mapping.md).
# Factory program 1: knobs K1-K8 = CC 1-8, pads bank A = notes 44-51, all on
# MIDI channel 1.
#
# Knob layout (top row Deck A, bottom row Deck B):
#   K1 A volume   K2 A pitch coarse   K3 A pitch fine   K4 master
#   K5 B volume   K6 B pitch coarse   K7 B pitch fine   K8 headphones
#
# Pads, bank A (bottom row):
#   pad 1 A play/pause   pad 2 A cue   pad 3 B play/pause   pad 4 B cue
# Pads, bank B (press PAD BANK), hot cues:
#   bottom row pads 1-4 = Deck A hot cues 1-4 (notes 32-35)
#   top row    pads 5-8 = Deck B hot cues 1-4 (notes 36-39)
#   An empty hot cue is set at the playhead; a set one jumps there.
#   Clear hot cues on screen (Shift + click) or with Shift + 1-4 / 7-0.
#
# Caution: the piano keys also send notes on channel 1. At the default
# octave they start at note 48, clear of pads 1-4 (44-47). With OCT- pressed
# the keys overlap the pads and will trigger them.

name: Akai MPK Mini Mk II
device_name_contains: [MPK Mini Mk II]
verified: false   # numbers read from the device; set true once tested by hand

knobs:
  - { cc: 1, action: channelVolume, deck: A }                                     # K1
  - { cc: 5, action: channelVolume, deck: B }                                     # K5
  - { cc: 2, action: pitchCoarse, deck: A, min: -16, max: 16, takeover: pickup }  # K2
  - { cc: 6, action: pitchCoarse, deck: B, min: -16, max: 16, takeover: pickup }  # K6
  - { cc: 3, action: pitchFine,   deck: A, min: -1,  max: 1,  takeover: pickup }  # K3
  - { cc: 7, action: pitchFine,   deck: B, min: -1,  max: 1,  takeover: pickup }  # K7
  - { cc: 4, action: masterVolume }                                               # K4
  - { cc: 8, action: headphoneVolume }                                            # K8

pads:
  # Pad 1: Deck A play / pause.
  - { note: 44, channel: 1, deck: A, on_press: togglePlay }
  # Pad 2: Deck A cue. Tap = play from cue. Hold 1 s = set cue where the press began.
  - { note: 45, channel: 1, deck: A, on_press: armCue, on_tap: playFromCue, on_hold: commitCue, hold_ms: 1000 }
  # Pad 3: Deck B play / pause.
  - { note: 46, channel: 1, deck: B, on_press: togglePlay }
  # Pad 4: Deck B cue, same as pad 2.
  - { note: 47, channel: 1, deck: B, on_press: armCue, on_tap: playFromCue, on_hold: commitCue, hold_ms: 1000 }

  # Bank B: hot cues. Bottom row = Deck A, top row = Deck B.
  - { note: 32, channel: 1, deck: A, slot: 1, on_press: hotCue }
  - { note: 33, channel: 1, deck: A, slot: 2, on_press: hotCue }
  - { note: 34, channel: 1, deck: A, slot: 3, on_press: hotCue }
  - { note: 35, channel: 1, deck: A, slot: 4, on_press: hotCue }
  - { note: 36, channel: 1, deck: B, slot: 1, on_press: hotCue }
  - { note: 37, channel: 1, deck: B, slot: 2, on_press: hotCue }
  - { note: 38, channel: 1, deck: B, slot: 3, on_press: hotCue }
  - { note: 39, channel: 1, deck: B, slot: 4, on_press: hotCue }
