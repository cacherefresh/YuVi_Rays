name: yuvi_deck
description: YuVi Rays deck widget — self-contained DJ deck component with EQ, fader, waveform, and transport controls.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  yuvi_audio_engine:
    path: ../yuvi_audio_engine
  yuvi_controls:
    path: ../yuvi_controls
  yuvi_waveform:
    path: ../yuvi_waveform
  file_picker: ^8.0.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
