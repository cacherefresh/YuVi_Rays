name: yuvi_rays
description: YuVi Rays — FOSS Web Audio Digital Vinyl System built with Flutter Web.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── Local packages ──────────────────────────────────────────────────
  yuvi_audio_engine:
    path: packages/yuvi_audio_engine
  yuvi_controls:
    path: packages/yuvi_controls
  yuvi_waveform:
    path: packages/yuvi_waveform
  yuvi_deck:
    path: packages/yuvi_deck

  # ── Third-party ─────────────────────────────────────────────────────
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/royalty_free_audio/manifest.json
