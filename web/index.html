<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YuVi Rays — FOSS Web Audio Digital Vinyl System">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YuVi Rays DVS">
  <meta name="theme-color" content="#00D4AA">

  <!-- Favicon — browser tab, bookmarks, homescreen, Google/Apple display -->
  <!-- SVG: scales perfectly on all modern browsers -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon/favicon.svg">
  <!-- PNG 96px: fallback for browsers that don't support SVG favicons -->
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon/favicon-96x96.png">
  <!-- ICO: legacy browsers and Windows taskbar pinning -->
  <link rel="icon" type="image/x-icon" href="icons/favicon/favicon.ico">
  <!-- Apple touch icon: iOS home screen, iPad dock, macOS Safari bookmarks -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/favicon/apple-touch-icon.png">

  <title>YuVi Rays DVS</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Tone.js — audio processing and Web Audio API routing.
    NexusUI and Wavesurfer.js can be added here as additional layers.
  -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.9.11/build/Tone.js"></script>

  <!-- YuVi Rays JS bridge — must load after Tone.js -->
  <script src="js/yuvi_bridge.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1C1C1E;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
